<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>设计预览 · 登录系统 · 图书馆志愿服务</title>
<link rel="stylesheet" href="preview.css">
<script>
  try {
    var mode = localStorage.getItem('preview-theme') || 'system';
    var dark = mode === 'dark' ||
      (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (error) { /* 忽略 */ }
</script>
<script src="preview.js" defer></script>
</head>
<body>
<a class="skip-link" href="#login-form">跳到登录表单</a>

<main class="auth-page auth-page--editorial">
  <section class="auth-hero" aria-label="品牌封面">
    <p class="auth-hero-top">四川大学图书馆 · 志愿服务管理系统</p>

    <div class="auth-hero-main">
      <div class="auth-brand">
        <span class="auth-brand-tile"><svg class="i" aria-hidden="true"><use href="#i-book"></use></svg></span>
        <span>
          <strong>图书馆志愿服务</strong>
        </span>
      </div>

      <h1 class="auth-headline"><span class="auth-headline-line">把每一次志愿服务，</span><br><span class="auth-headline-line">安排妥当。</span></h1>
      <p class="auth-hero-signature">四川大学图书馆志愿服务队</p>
    </div>

    <p class="auth-cover-index"><span>ARCHIVE</span><span>SCU · 2026</span></p>
  </section>

  <div class="auth-binding" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
  </div>

  <section class="auth-panel" aria-label="登录区域">
    <button class="theme-button auth-theme" type="button" data-theme-toggle title="切换外观" aria-label="切换外观">
      <svg class="i" aria-hidden="true"><use href="#i-moon"></use></svg>
      <span class="sr-only">外观：跟随系统</span>
    </button>

    <div class="auth-card">
      <div class="auth-chapter" aria-hidden="true"><span></span><small>01</small></div>
      <h2>登录系统</h2>
      <form class="auth-form" id="login-form" novalidate>
        <fieldset class="auth-field auth-identity">
          <legend>身份</legend>
          <div class="auth-segment">
            <label><input name="kind" type="radio" value="admin" checked><span>管理员</span></label>
            <label><input name="kind" type="radio" value="student"><span>志愿者</span></label>
          </div>
        </fieldset>

        <div class="auth-field">
          <label for="login-account">账号</label>
          <div class="auth-control">
            <input id="login-account" name="account" type="text" autocomplete="username"
                   placeholder="请输入账号" maxlength="64">
          </div>
        </div>

        <div class="auth-field">
          <div class="auth-label-row">
            <label for="login-password">密码</label>
            <a class="auth-link" href="password.html#reset">忘记密码</a>
          </div>
          <div class="auth-control">
            <input id="login-password" name="password" type="password"
                   autocomplete="current-password" placeholder="请输入密码" maxlength="128">
            <span class="trail">
              <button class="auth-reveal" type="button" data-reveal="login-password" aria-label="显示密码">
                <svg class="i" aria-hidden="true"><use href="#i-eye"></use></svg><span class="sr-only">显示密码</span>
              </button>
            </span>
          </div>
        </div>

        <p class="auth-error" id="login-error" role="alert" hidden></p>
        <button class="auth-submit" type="submit">
          <span>登录</span>
          <svg class="i" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
        </button>
      </form>

    </div>
  </section>
</main>
</body>
</html>
