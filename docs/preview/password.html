<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>设计预览 · 找回密码 · 图书馆志愿服务</title>
<link rel="stylesheet" href="preview.css">
<script>
  try {
    var mode = localStorage.getItem('preview-theme') || 'system';
    var dark = mode === 'dark' ||
      (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (error) { /* 忽略 */ }
</script>
<script src="preview.js" defer></script>
</head>
<body>
<a class="skip-link" href="#auth-reset">跳到找回密码表单</a>

<main class="auth-page auth-page--editorial auth-page--password">
  <section class="auth-hero" aria-label="品牌封面">
    <p class="auth-hero-top">四川大学图书馆 · 志愿服务管理系统</p>

    <div class="auth-hero-main">
      <div class="auth-brand">
        <span class="auth-brand-tile"><svg class="i" aria-hidden="true"><use href="#i-book"></use></svg></span>
        <span>
          <strong>图书馆志愿服务</strong>
        </span>
      </div>

      <h1 class="auth-headline"><span class="auth-headline-line">把每一次志愿服务，</span><br><span class="auth-headline-line">安排妥当。</span></h1>
      <p class="auth-hero-signature">四川大学图书馆志愿服务队</p>
    </div>

    <p class="auth-cover-index"><span>ARCHIVE</span><span>SCU · 2026</span></p>
  </section>

  <div class="auth-binding" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
  </div>

  <section class="auth-panel" aria-label="找回密码区域">
    <button class="theme-button auth-theme" type="button" data-theme-toggle title="切换外观" aria-label="切换外观">
      <svg class="i" aria-hidden="true"><use href="#i-moon"></use></svg>
      <span class="sr-only">外观：跟随系统</span>
    </button>

    <div class="auth-card">
      <div class="auth-chapter" aria-hidden="true"><span></span><small>02</small></div>
      <h2>找回密码</h2>
      <p class="auth-sub">提交账号信息后，由管理员协助重置，并通过其他方式告知你。</p>

      <p class="auth-legacy-notice" id="legacy-change-notice" role="status" hidden>请登录后在工作台修改密码</p>

      <form class="auth-form" id="auth-reset" novalidate>
        <fieldset class="auth-field auth-identity">
          <legend>身份</legend>
          <div class="auth-segment">
            <label><input name="kind" type="radio" value="admin" checked><span>管理员</span></label>
            <label><input name="kind" type="radio" value="student"><span>志愿者</span></label>
          </div>
        </fieldset>

        <div class="auth-form-grid">
          <div class="auth-field auth-grid-wide">
            <label for="reset-account">账号</label>
            <div class="auth-control">
              <input id="reset-account" name="account" type="text" autocomplete="username"
                     placeholder="请输入账号" maxlength="64" required>
            </div>
          </div>

          <div class="auth-field">
            <label for="reset-name">姓名</label>
            <div class="auth-control">
              <input id="reset-name" name="name" type="text" autocomplete="name"
                     placeholder="与账号库姓名一致" maxlength="64" required>
            </div>
          </div>

          <div class="auth-field">
            <label for="reset-phone">手机号 <small>选填</small></label>
            <div class="auth-control">
              <input id="reset-phone" name="phone" type="tel" autocomplete="tel"
                     placeholder="便于管理员联系" maxlength="20">
            </div>
          </div>

          <div class="auth-field auth-grid-wide">
            <label for="reset-reason">情况说明 <small>选填</small></label>
            <div class="auth-control">
              <textarea id="reset-reason" name="reason" rows="1" placeholder="简要说明情况" maxlength="500"></textarea>
            </div>
          </div>
        </div>

        <p class="auth-error" id="reset-error" role="alert" hidden></p>
        <button class="auth-submit" type="submit">
          <span>提交重置申请</span>
          <svg class="i" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
        </button>
      </form>

      <a class="auth-back" href="login.html">
        <svg class="i" aria-hidden="true"><use href="#i-arrow-left"></use></svg>返回登录
      </a>
    </div>
  </section>
</main>
</body>
</html>
