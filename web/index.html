    // 首屏前套用主题，避免闪白：localStorage 存 light/dark/system，缺省跟随系统
    try {
      var themeMode = localStorage.getItem('volunteer_theme') || 'system';
      var resolved = themeMode === 'dark' || (themeMode === 'system' &&
        matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', resolved);
    } catch (error) { /* 隐私模式下忽略存储错误 */ }
  </script>
