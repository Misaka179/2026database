<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>找回密码 · 图书馆志愿服务</title>
  <link rel="stylesheet" href="/static/app.css?v=2.5.6">
  <link rel="stylesheet" href="/static/app-v25.css?v=2.5.6">
  <script>
    try {
      var themeMode = localStorage.getItem('volunteer_theme') || 'system';
      var resolved = themeMode === 'dark' || (themeMode === 'system' &&
        matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', resolved);
    } catch (error) { /* 隐私模式下忽略存储错误 */ }
  </script>
  <script src="/static/password.js?v=2.5.6" defer></script>
</head>
<body>
  <a class="skip-link" href="#password-main">跳到密码表单</a>

  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" focusable="false">
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5V6a2 2 0 0 1 2-2h13v15.5"/><path d="M6 19.5h13"/><path d="M8 7h7"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 3"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M15.5 5.2a3 3 0 0 1 0 5.6"/><path d="M17.4 14.2A5.5 5.5 0 0 1 20.5 19"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/><path d="M12 14.5v2"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.8.4-1 .9-1 1.8"/><path d="M12 16.5h.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H6M12 6l-6 6 6 6"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></symbol>
  </svg>

  <main class="auth-page auth-page--password" id="password-main">
    <section class="auth-hero" aria-label="系统简介">
      <p class="auth-hero-top">四川大学图书馆志愿服务队管理系统</p>
      <div class="auth-hero-main">
        <div class="auth-brand">
          <span class="auth-brand-tile"><svg class="i" aria-hidden="true"><use href="#i-book"></use></svg></span>
          <span><strong>图书馆志愿服务</strong><small>四川大学图书馆志愿服务队</small></span>
        </div>
        <span class="auth-chip">志愿服务 · 一站式管理</span>
        <h1 class="auth-headline">把每一次志愿服务，安排妥当。</h1>
        <div class="auth-features">
          <div class="auth-feature">
            <span class="auth-feature-icon"><svg class="i" aria-hidden="true"><use href="#i-calendar"></use></svg></span>
            <span><strong>排班与考勤</strong></span>
          </div>
          <div class="auth-feature">
            <span class="auth-feature-icon"><svg class="i" aria-hidden="true"><use href="#i-check"></use></svg></span>
            <span><strong>申请与审批</strong></span>
          </div>
          <div class="auth-feature">
            <span class="auth-feature-icon"><svg class="i" aria-hidden="true"><use href="#i-clock"></use></svg></span>
            <span><strong>时长与信用</strong></span>
          </div>
          <div class="auth-feature">
            <span class="auth-feature-icon"><svg class="i" aria-hidden="true"><use href="#i-users"></use></svg></span>
            <span><strong>分队与负责人</strong></span>
          </div>
        </div>
      </div>
    </section>

    <section class="auth-panel">
      <button class="theme-button auth-theme" type="button" data-theme-toggle aria-label="切换外观">
        <span data-theme-icon><svg class="i" aria-hidden="true"><use href="#i-moon"></use></svg></span>
        <span data-theme-label>外观：跟随系统</span>
      </button>

      <div class="auth-card">
        <div class="auth-mobile-brand">
          <span class="brand-mark"><svg class="i" aria-hidden="true"><use href="#i-book"></use></svg></span>
          <span><strong>图书馆志愿服务</strong><small>四川大学图书馆志愿服务队</small></span>
        </div>

        <h2>忘记密码</h2>

        <form class="auth-form" id="reset-form" novalidate>
          <div class="auth-field">
            <label for="reset-kind">登录身份</label>
            <div class="auth-control">
              <svg class="i lead" aria-hidden="true"><use href="#i-users"></use></svg>
              <select id="reset-kind" name="kind">
                <option value="admin">管理员</option>
                <option value="student">志愿者</option>
              </select>
              <span class="trail"><svg class="i" aria-hidden="true"><use href="#i-chevron-down"></use></svg></span>
            </div>
          </div>
          <div class="auth-field">
            <label for="reset-account">学号或账号</label>
            <div class="auth-control">
              <svg class="i lead" aria-hidden="true"><use href="#i-user"></use></svg>
              <input id="reset-account" name="account" type="text" placeholder="请输入学号或账号" maxlength="64" required>
            </div>
          </div>
          <div class="auth-field">
            <label for="reset-name">姓名</label>
            <div class="auth-control">
              <svg class="i lead" aria-hidden="true"><use href="#i-user"></use></svg>
              <input id="reset-name" name="name" type="text" placeholder="请输入姓名" maxlength="64" required>
            </div>
          </div>
          <div class="auth-field">
            <label for="reset-reason">说明（选填）</label>
            <div class="auth-control">
              <textarea id="reset-reason" name="reason" placeholder="选填" maxlength="500"></textarea>
            </div>
          </div>
          <div id="reset-feedback" class="notice" role="status" hidden></div>
          <button class="auth-submit" type="submit">
            提交重置申请
            <svg class="i" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
          </button>
        </form>

        <div class="auth-note">
          <svg class="i" aria-hidden="true"><use href="#i-info"></use></svg>
          <span>提交申请后由管理员核实身份进行重置密码处理，新密码会通过通知告知你。</span>
        </div>
        <a class="auth-back" href="/">
          <svg class="i" aria-hidden="true"><use href="#i-arrow-left"></use></svg>返回登录
        </a>
      </div>
    </section>
  </main>
</body>
</html>
