<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>找回密码 · 图书馆志愿服务</title>
  <link rel="stylesheet" href="/static/app.css?v=2.5.41">
  <link rel="stylesheet" href="/static/app-v25.css?v=2.6.6">
  <script>
    try {
      var themeMode = localStorage.getItem('volunteer_theme') || 'system';
      var resolved = themeMode === 'dark' || (themeMode === 'system' &&
        matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', resolved);
    } catch (error) { /* 隐私模式下忽略存储错误 */ }
  </script>
  <script src="/static/password.js?v=2.6.6" defer></script>
</head>
<body>
  <a class="skip-link" href="#reset-form">跳到找回密码表单</a>

  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" focusable="false">
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5V6a2 2 0 0 1 2-2h13v15.5"/><path d="M6 19.5h13"/><path d="M8 7h7"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H6M12 6l-6 6 6 6"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></symbol>
  </svg>

  <main class="auth-page auth-page--password" id="password-main">
    <section class="auth-hero" aria-label="系统简介">
      <p class="auth-hero-top">四川大学图书馆 · 志愿服务管理系统</p>
      <div class="auth-hero-main">
        <div class="auth-brand">
          <span class="auth-brand-tile"><svg class="i" aria-hidden="true"><use href="#i-book"></use></svg></span>
          <span><strong>图书馆志愿服务</strong></span>
        </div>
        <h1 class="auth-headline"><span class="auth-headline-line">把每一次志愿服务，</span><br><span class="auth-headline-line">安排妥当。</span></h1>
        <p class="auth-signature">四川大学图书馆志愿服务队</p>
      </div>
    </section>

    <div class="auth-binding" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>

    <section class="auth-panel">
      <button class="icon-button auth-theme" type="button" data-theme-toggle title="切换主题" aria-label="切换主题">
        <span data-theme-icon><svg class="i" aria-hidden="true"><use href="#i-moon"></use></svg></span>
      </button>

      <div class="auth-card">
        <p class="auth-eyebrow"><span>02</span></p>
        <h2>找回密码</h2>
        <p class="auth-sub">提交账号信息后，由管理员协助重置，并通过其他方式告知你。</p>

        <form class="auth-form" id="reset-form" novalidate>
          <div id="reset-feedback" class="notice" role="status" hidden></div>
          <fieldset class="auth-identity">
            <legend>身份</legend>
            <div class="auth-segmented">
              <label><input type="radio" name="kind" value="admin" checked><span>管理员</span></label>
              <label><input type="radio" name="kind" value="student"><span>志愿者</span></label>
            </div>
          </fieldset>
          <div class="auth-field">
            <label for="reset-account">账号</label>
            <div class="auth-control">
              <input id="reset-account" name="account" type="text" autocomplete="username"
                     placeholder="请输入账号" maxlength="64" required>
            </div>
          </div>
          <div class="auth-field">
            <label for="reset-name">姓名</label>
            <div class="auth-control">
              <input id="reset-name" name="name" type="text" autocomplete="name"
                     placeholder="与账号库姓名一致" maxlength="64" required>
            </div>
          </div>
          <div class="auth-field">
            <label for="reset-phone">手机号 <span class="auth-optional">选填</span></label>
            <div class="auth-control">
              <input id="reset-phone" name="phone" type="tel" autocomplete="tel"
                     placeholder="便于管理员联系" maxlength="20">
            </div>
          </div>
          <div class="auth-field">
            <label for="reset-reason">情况说明 <span class="auth-optional">选填</span></label>
            <div class="auth-control">
              <textarea id="reset-reason" name="reason" rows="1" placeholder="简要说明情况" maxlength="500"></textarea>
            </div>
          </div>
          <button class="auth-submit" type="submit">
            <span>提交重置申请</span>
            <svg class="i" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
          </button>
        </form>

        <a class="auth-back" href="/">
          <svg class="i" aria-hidden="true"><use href="#i-arrow-left"></use></svg>返回登录
        </a>
      </div>
    </section>
  </main>
</body>
</html>
